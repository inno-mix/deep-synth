[project]
name = "backend"
version = "0.1.0"
description = "Multi-agent technical research API (LangGraph + FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "arize-phoenix-otel>=0.17.2",
    "asyncpg>=0.32.0",
    "ddgs>=9.16.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openinference-instrumentation-langchain>=0.1.82",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.1.8",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.6.0",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app.main:app"
